services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: codeduel
      POSTGRES_PASSWORD: codeduel_local
      POSTGRES_DB: codeduel
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeduel -d codeduel"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
